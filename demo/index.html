<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes"
    >
    <title>t-lang demo</title>
    <script type="module" src="../t-lang.js"></script>
    <script type="module" src="../t-option.js"></script>
    <link rel="stylesheet" href="/style/sakura.css" type="text/css">
  </head>
  <body>
    <div>
      <h1>Basic t-lang demo</h1>
      <hr>
      <label for="lang">
        <t-lang data-en>Language</t-lang>
        <t-lang data-fr>Langue</t-lang>
        <t-lang data-bn>ভাষা</t-lang>
        <t-lang data-ar>لغة</t-lang>
      </label>
      <select id="lang">
        <option
          is="t-option"
          value="en"
          data-en="English"
          data-fr="Anglaise"
          data-bn="ইংরেজি"
          data-ar="إنجليزي"
        >
          English
        </option>
        <option
          is="t-option"
          value="fr"
          data-en="French"
          data-fr="Français"
          data-bn="ফরাসি"
          data-ar="فرنسي"
          selected
        >
          French
        </option>
        <option
          is="t-option"
          value="bn"
          data-en="Bengali"
          data-fr="Bengali"
          data-bn="বাংলা"
          data-ar="البنغالية"
        >
          Bengali
        </option>
        <option
          is="t-option"
          value="ar"
          data-en="Arabic"
          data-fr="Arabe"
          data-bn="আরবি"
          data-ar="العربية"
        >
          Arabic
        </option>
      </select>
      <hr>
    </div>
  </body>

  <script>
  (() => {
    const langSelect = document.getElementById("lang");
    langSelect.addEventListener("change", () => {
      document.documentElement.lang = langSelect.value;
    });
  })();
  </script>
</html>
